[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unwarp"
version = "0.1.3"
description = "Manage WireGuard profiles and split-tunnel routes for Cloudflare Zero Trust"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
qr = ["segno>=1.5"]

[project.scripts]
unwarp = "unwarp.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["unwarp", "unwarp.*"]
namespaces = false
